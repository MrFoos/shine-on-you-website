name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # GitHub-runnere kjører UTC. date.test.js bygger på norsk lokaltid —
      # den sjekker at 22:15 UTC regnes som 5. september, slik en besøkende
      # i Norge ser det. Uten dette feiler den i CI og består lokalt, som er
      # verre enn ingen test.
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Samme major som deploy-workflowen.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tester
        # `npm test -- --run` framfor `npx vitest run`, så CI og package.json
        # ikke kan komme i utakt.
        run: npm test -- --run

      - name: Produksjonsbuild
        # Dummy-verdier med vilje: dependabot-PR-er får ikke tilgang til
        # repoets secrets, så en build som krever de ekte nøklene ville
        # feilet på nettopp de PR-ene dette er ment å fange. Vite trenger
        # bare at variablene er definert for å bygge.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-key
        run: npm run build
